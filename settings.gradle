pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'dead-air'

// JLayer relocation runs here (Shadow only) so MixinGradle in the root project does not hook that ShadowJar task (avoids circular dependency).
include 'embedded-jlayer'

includeBuild('../ESC') {
    dependencySubstitution {
        substitute module('uk.co.extraspecialstudio:extraspecialcore') using project(':')
    }
}
